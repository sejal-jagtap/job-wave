name: JobWave watch

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 min: ~1,440 min/month, inside GitHub Free (2,000). With GitHub Pro use */20.
  workflow_dispatch:              # "Run workflow" button
    inputs:
      mode:
        description: "watch = normal check · demo = alert on the 3 newest matches now (for recording)"
        type: choice
        options: [watch, demo]
        default: watch
  push:
    paths: [config.yaml, "jobwave/**"]

permissions:
  contents: write

concurrency:
  group: jobwave
  cancel-in-progress: false

jobs:
  watch:
    # Never runs in a fork or copy that isn't yours; alerts go only to the secrets set in YOUR repo.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check job boards and send alerts
        run: |
          if [ "${{ inputs.mode }}" = "demo" ]; then python -m jobwave demo --count 3; else python -m jobwave run; fi
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      - name: Save seen-jobs state
        if: ${{ inputs.mode != 'demo' }}
        run: |
          git config user.name "jobwave-bot"
          git config user.email "jobwave-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "jobwave: check $(date -u +%Y-%m-%dT%H:%MZ)"
          # If state/ changed on GitHub meanwhile, keep this run's (newest) version of state/.
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          echo "Could not save state after 3 tries"; exit 1