# JobWave config — edit this file, commit, and the next run picks it up.

profile:
  grad_year: 2027                 # roles that name only other class years (2025, 2026...) are dropped
  degrees: ["Bachelor's", "Master's"]   # PhD-only roles are dropped
  skills: [python, sql, pytorch, tensorflow, spark, airflow, dbt, aws, azure, gcp,
           llm, nlp, machine learning, genai, rag, tableau, power bi, snowflake, databricks]

filters:
  role_families: [data_science, ml_ai, data_engineering, analytics, research]
  include_internships: false
  max_years_experience: 2         # drop if the posting asks for more (e.g. "3+ years")
  allow_unlabeled_level: true     # company-board roles with no "new grad / entry" label pass only if YOE <= max
  us_only: true
  locations: []                   # empty = anywhere in the US; else substrings, e.g. ["TX", "Remote", "New York"]
  preferred_locations: [Dallas, Plano, Irving, Austin, Remote]   # ranked higher, not required
  remote_only: false
  exclude_if: [citizenship, clearance]   # drop roles requiring US citizenship / security clearance
  needs_sponsorship: false        # true = also drop roles that say they don't sponsor visas
  min_salary: 0                   # USD/yr; only applied when the posting lists pay
  include_keywords: []            # title must contain one of these (empty = no constraint)
  exclude_keywords: [senior, staff, principal, lead, manager, director, head of, sr., sr, ii, iii, iv, "2", "3",
                     annotator, rater, raters, labeler, tutor, trainer, teleoperator]
  company_blocklist: []

alerts:
  max_age_hours: 72               # only alert on roles posted in the last N hours
  digest_threshold: 5             # more than N new matches in one run -> one digest message
  broken_source_after_runs: 8     # alert once if a career page fails this many checks in a row (~2h)
  # Channels are enabled by setting secrets / env vars:
  #   NTFY_TOPIC                      -> phone/desktop push via ntfy.sh (free, no account)
  #   SLACK_WEBHOOK_URL / DISCORD_WEBHOOK_URL
  #   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, ALERT_EMAIL_TO  -> email

sources:
  simplify_newgrad: true          # SimplifyJobs/New-Grad-Positions (thousands of new-grad roles, updated hourly)
  greenhouse: [anthropic, databricks, scaleai, stripe, airbnb, robinhood, figma, datadog, mongodb,
               cloudflare, coinbase, pinterest, instacart, lyft, reddit, discord, duolingo, samsara,
               roblox, affirm, brex, gusto, asana, dropbox, twilio, waymo, nuro, toast, chime, block]
  lever: [palantir, plaid, spotify, zoox, wealthfront]
  ashby: [openai, cohere, notion, ramp, perplexity, linear, replit, harvey, elevenlabs, mercor, sierra, modal]

